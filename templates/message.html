<!DOCTYPE html>
<html lang="Zn-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息提醒 测试版</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">

    
</head>
<body>
    {% include "navbar.html" %}

    <div class="form-card">
            <h3>小盒子社区-信息提醒</h3>
            <ul>
                {% for message in messages %}
                    <li>{{ message|safe }}</li>
                {% endfor %}
            </ul>
            <p>侮辱信息不要怕，举报滥用：sbox520@163.com，或者前往QQ交流群：1037989684提交举报申请，如果觉得不公正，可以发送到sbox@520014.xyz，记得附上完整证据链</p>
    </div>
    <footer>
            {{ footer|safe }}
    </footer>

    <script>
        // 导航栏下拉菜单切换
        function toggleDropdown(event) {
            event.preventDefault();
            event.stopPropagation();
            
            const toggle = event.currentTarget;
            const dropdown = toggle.closest('.navbar-dropdown');
            
            if (!dropdown) {
                console.error('Dropdown parent not found');
                return;
            }
            
            // 关闭其他打开的下拉菜单
            document.querySelectorAll('.navbar-dropdown.open').forEach(function(dd) {
                if (dd !== dropdown) {
                    dd.classList.remove('open');
                }
            });
            
            // 切换当前下拉菜单
            const isOpen = dropdown.classList.contains('open');
            if (isOpen) {
                dropdown.classList.remove('open');
            } else {
                dropdown.classList.add('open');
            }
        }

        document.addEventListener('click', function (event) {
            const dropdown = document.querySelector('.dropdown');
            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove('open');
            }
        });

        // 跳转到搜索页面
        function navigateToSearch() {
            window.location.href = "search";
        }

        // 文件选择交互
        document.querySelector('.file-input').addEventListener('click', () => {
            document.getElementById('file').click();
        });
    </script>
</body>
</html>
