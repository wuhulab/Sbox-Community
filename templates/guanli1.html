<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员表单</title>
    <style>
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .section h2 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin: 10px 0;
        }
        .form-group label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            padding: 5px;
            margin-left: 10px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #008CBA;
        }
        .btn-secondary:hover {
            background-color: #007B9A;
        }
    </style>
</head>
<body>
    <h1>管理员表单</h1>

    <!-- Batch Upload Section -->
    <div class="section">
        <h2>批量上传 .sb3 文件</h2>
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="batch_upload" value="true">
            <div class="form-group">
                <label for="sb3_files">选择 .sb3 文件:</label>
                <input type="file" id="sb3_files" name="sb3_files" multiple accept=".sb3" required>
                <p style="margin-left: 130px; font-size: 12px; color: #666;">可选择多个 .sb3 文件进行批量上传</p>
            </div>
            <button type="submit" class="btn">开始批量上传</button>
        </form>
    </div>

    <!-- Original Admin Functions -->
    <div class="section">
        <h2>管理功能</h2>
        <form method="POST">
            <!-- 下拉选择 -->
            <div class="form-group">
                <label for="selection">选择:</label>
                <select name="selection" id="selection">
                    <option value="路障作品">路障作品</option>
                    <option value="解除路障作品">解除路障作品</option>
                    <option value="封号">封号</option>
                    <option value="解封">解封</option>
                    <option value="设为高级管理">设为高级管理（输入用户名）</option>
                    <option value="设为社区风气管理员">设为社区风气管理员（输入用户名）</option>
                    <option value="正式成员">正式成员（输入ID）</option>
                    <option value="AIapi充值">AIapi充值（输入用户名，理由填充值）</option>
                </select>
            </div>

            <!-- 目标输入框 -->
            <div class="form-group">
                <label for="target">目标id:</label>
                <input type="text" id="target" name="target" required>
            </div>

            <!-- 理由输入框 -->
            <div class="form-group">
                <label for="reason">理由:</label>
                <input type="text" id="reason" name="reason" required>
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="btn btn-secondary">提交</button>
        </form>
    </div>
</body>
</html>
