<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小盒子社区-{{ username }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        /* 导航栏样式 */
        nav {
            background-color: #333;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        /* 图标样式 */
        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }

        /* 右侧下拉菜单样式 */
        .dropdown {
            position: relative;
            background-color: #333;
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .dropdown-content {
            display: none;
            background-color: #333;
            color: white;
            position: absolute;
            top: 100%;
            right: 0;
            width: 200px;
            border-radius: 5px;
            z-index: 1000;
        }

        .dropdown-content a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: white;
        }

        .dropdown-content a:hover {
            background-color: #575757;
        }

        /* 打开下拉菜单 */
        .dropdown.open .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    {% include "navbar.html" %}

    <div>
    <h1>{{ username }}</h1>
    <h2>简介</h2>
    <p></p>
        {% for item in zhuopinsc1 %}
            <li>
                <a href="/scratch/{{ item.id }}">{{ item.title }}</a>
            </li>
        {% endfor %}
    </div>
    <script>
        // 导航栏下拉菜单切换
        function toggleDropdown(event) {
            event.preventDefault();
            event.stopPropagation();
            
            const toggle = event.currentTarget;
            const dropdown = toggle.closest('.navbar-dropdown');
            
            if (!dropdown) {
                console.error('Dropdown parent not found');
                return;
            }
            
            // 关闭其他打开的下拉菜单
            document.querySelectorAll('.navbar-dropdown.open').forEach(function(dd) {
                if (dd !== dropdown) {
                    dd.classList.remove('open');
                }
            });
            
            // 切换当前下拉菜单
            const isOpen = dropdown.classList.contains('open');
            if (isOpen) {
                dropdown.classList.remove('open');
            } else {
                dropdown.classList.add('open');
            }
        }
    </script>
</body>
</html>
