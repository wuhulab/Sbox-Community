<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 14px;
            color: #555;
            text-align: left;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            font-size: 14px;
            color: #555;
        }

        a {
            color: #4CAF50;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .back-link {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>忘记密码</h1>
        
        <!-- Step 1: Enter Email -->
        <div id="step1" class="step active">
            <form id="emailForm" method="POST" action="/forget">
                <input type="hidden" name="step" value="1">
                <label for="email">请输入您的邮箱:</label>
                <input type="email" id="email" name="email" required>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div style="color: {% if category == "error" %}red{% elif category == "success" %}green{% else %}blue{% endif %};">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endwith %}
                
                <button type="submit">发送验证码</button>
            </form>
            <div class="back-link">
                <a href="{{ url_for("login") }}">返回登录</a>
            </div>
        </div>
        
        <!-- Step 2: Enter Verification Code -->
        <div id="step2" class="step">
            <form id="verificationForm" method="POST" action="/forget">
                <input type="hidden" name="step" value="2">
                <input type="hidden" name="email" id="verificationEmail" value="">
                <label for="verification_code">请输入验证码:</label>
                <input type="text" id="verification_code" name="verification_code" required>
                <button type="submit">验证</button>
            </form>
            <div class="back-link">
                <a href="#" onclick="showStep(1)">返回上一步</a> | 
                <a href="{{ url_for("login") }}">返回登录</a>
            </div>
        </div>
        
        <!-- Step 3: Reset Password -->
        <div id="step3" class="step">
            <form id="passwordForm" method="POST" action="/forget">
                <input type="hidden" name="step" value="3">
                <input type="hidden" name="email" id="passwordEmail" value="">
                <label for="new_password">新密码:</label>
                <input type="password" id="new_password" name="new_password" required>
                
                <label for="confirm_password">确认密码:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
                
                <button type="submit">重置密码</button>
            </form>
            <div class="back-link">
                <a href="{{ url_for("login") }}">返回登录</a>
            </div>
        </div>
    </div>

    <script>
        // Function to show specific step
        function showStep(stepNum) {
            // Hide all steps
            document.querySelectorAll(".step").forEach(step => {
                step.classList.remove("active");
            });
            
            // Show the requested step
            document.getElementById("step" + stepNum).classList.add("active");
        }
        
        // Check if we need to show step 2 or 3 based on server response
        {% if step == 2 %}
            showStep(2);
            document.getElementById("verificationEmail").value = "{{ email }}";
        {% elif step == 3 %}
            showStep(3);
            document.getElementById("passwordEmail").value = "{{ email }}";
        {% endif %}
    </script>
</body>
</html>
