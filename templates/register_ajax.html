<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 小盒子社区</title>
    <!-- 引入AJAX工具库和认证模块 -->
    <script src="{{ url_for('static', filename='js/ajax-utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #667eea;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .hint {
            font-size: 12px;
            margin-top: 5px;
            height: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-code {
            margin-top: 10px;
            background: #4CAF50;
        }

        .flash-message {
            margin: 15px 0;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .flash-message.error {
            background-color: #ffebee;
            color: #c62828;
        }

        .flash-message.success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .password-strength {
            font-size: 12px;
            margin-top: 5px;
        }

        .password-strength.weak {
            color: #f44336;
        }

        .password-strength.medium {
            color: #ff9800;
        }

        .password-strength.strong {
            color: #4CAF50;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>注册</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message {% if category %}{{ category }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名:</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="20">
                <div id="username-hint" class="hint"></div>
            </div>
            
            <div class="form-group">
                <label for="email">邮箱:</label>
                <input type="email" id="email" name="email" required>
                <div id="email-hint" class="hint"></div>
            </div>
            
            <div class="form-group">
                <label for="password">密码:</label>
                <input type="password" id="password" name="password" required minlength="8">
                <div id="password-strength" class="password-strength"></div>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">确认密码:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
                <div id="password-match" class="hint"></div>
            </div>
            
            <div class="form-group">
                <label for="yzm">验证码:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="yzm" name="yzm" required maxlength="6" style="flex: 1;">
                    <button type="button" id="send-code-btn" class="btn btn-code">发送验证码</button>
                </div>
            </div>
            
            <button type="submit" class="btn">注册</button>
        </form>
        
        <p>已有账户？<a href="{{ url_for('main.login') }}">登录</a></p>
    </div>

    <script>
        // 密码强度检查
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
            
            return strength;
        }

        // 实时密码强度显示
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthEl = document.getElementById('password-strength');
            const strength = checkPasswordStrength(password);
            
            strengthEl.className = 'password-strength';
            if (password.length === 0) {
                strengthEl.textContent = '';
            } else if (strength <= 2) {
                strengthEl.textContent = '密码强度：弱';
                strengthEl.classList.add('weak');
            } else if (strength <= 4) {
                strengthEl.textContent = '密码强度：中';
                strengthEl.classList.add('medium');
            } else {
                strengthEl.textContent = '密码强度：强';
                strengthEl.classList.add('strong');
            }
        });

        // 实时密码匹配检查
        document.getElementById('confirm_password').addEventListener('input', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = e.target.value;
            const matchEl = document.getElementById('password-match');
            
            if (confirmPassword.length === 0) {
                matchEl.textContent = '';
            } else if (password === confirmPassword) {
                matchEl.textContent = '密码匹配 ✓';
                matchEl.style.color = 'green';
            } else {
                matchEl.textContent = '密码不匹配 ✗';
                matchEl.style.color = 'red';
            }
        });

        // 发送验证码
        let countdown = 0;
        document.getElementById('send-code-btn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            
            if (!email) {
                SboxAjax.showMessage('请先输入邮箱地址', 'warning');
                return;
            }
            
            const btn = this;
            btn.disabled = true;
            countdown = 60;
            
            const timer = setInterval(() => {
                btn.textContent = `重新发送 (${countdown}s)`;
                countdown--;
                
                if (countdown < 0) {
                    clearInterval(timer);
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                }
            }, 1000);
            
            try {
                const result = await SboxAjax.post('/api/register/send-code', { email });
                
                if (result.success) {
                    SboxAjax.showMessage('验证码已发送到您的邮箱', 'success');
                } else {
                    SboxAjax.showMessage(result.error || '验证码发送失败', 'error');
                    clearInterval(timer);
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                }
            } catch (error) {
                SboxAjax.showMessage(error.message || '网络错误', 'error');
                clearInterval(timer);
                btn.textContent = '发送验证码';
                btn.disabled = false;
            }
        });

        // 表单提交
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            // 验证密码匹配
            if (data.password !== data.confirm_password) {
                SboxAjax.showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            // 验证密码强度
            const strength = checkPasswordStrength(data.password);
            if (strength < 4) {
                SboxAjax.showMessage('密码强度不足：至少8位，包含数字、大小写字母和特殊字符', 'error');
                return;
            }
            
            const submitBtn = this.querySelector('button[type="submit"]');
            SboxAjax.showLoading(submitBtn, true);
            
            try {
                const result = await SboxAjax.post('/api/register', data);
                
                if (result.success) {
                    SboxAjax.showMessage('注册成功！正在跳转到登录页面...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    SboxAjax.showMessage(result.error || '注册失败', 'error');
                }
            } catch (error) {
                SboxAjax.showMessage(error.message || '网络错误', 'error');
            } finally {
                SboxAjax.showLoading(submitBtn, false);
            }
        });
    </script>
</body>
</html>
